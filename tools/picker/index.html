<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ocean: #1d5fa8;
      --ocean-dark: #144678;
      --ocean-light: #4f8fd6;
      --button: #ff8a3d;
      --button-dark: #c95a17;
      --text: #1d2b3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Fredoka", "M PLUS Rounded 1c", sans-serif;
      color: white;
      background: var(--ocean);
      background-image:
        radial-gradient(circle at 20% 15%, var(--ocean-light) 0, transparent 40%),
        radial-gradient(circle at 85% 80%, var(--ocean-dark) 0, transparent 45%);
      background-attachment: fixed;
      min-height: 100vh;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .topbar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .back, .icon-btn {
      color: white;
      text-decoration: none;
      font-size: 1.3rem;
      font-weight: 600;
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      cursor: pointer;
      font-family: inherit;
    }
    .back:hover, .icon-btn:hover { background: rgba(255,255,255,0.25); }

    h1 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      text-shadow: 0 4px 0 var(--ocean-dark);
      margin: 10px 0 18px;
      text-align: center;
    }

    .settings {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px 22px;
      background: rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 14px 22px;
      font-size: 1.4rem;
      font-weight: 600;
    }
    .settings label { display: flex; align-items: center; gap: 10px; }
    .settings input[type=number] {
      width: 90px;
      font-family: inherit;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      border: none;
      border-radius: 12px;
      padding: 4px 6px;
      color: var(--text);
    }
    .settings input[type=checkbox] { width: 26px; height: 26px; accent-color: var(--button); }

    .stage {
      margin: 20px 0 20px;
      width: min(90vw, 50vh, 520px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: white;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 0 var(--ocean-dark), 0 24px 40px rgba(0,0,0,0.3);
      position: relative;
    }
    #number {
      font-size: min(30vw, 28vh, 17rem);
      font-weight: 700;
      line-height: 1;
    }
    #number.small { font-size: clamp(2rem, 6vw, 3rem); text-align: center; padding: 0 30px; }
    #number.pop { animation: pop 0.5s ease; color: var(--button-dark); }
    @keyframes pop {
      0% { transform: scale(0.5); }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .pick {
      font-family: inherit;
      font-size: 2.2rem;
      font-weight: 700;
      color: white;
      background: var(--button);
      border: none;
      border-radius: 20px;
      padding: 14px 60px;
      cursor: pointer;
      box-shadow: 0 7px 0 var(--button-dark);
    }
    .pick:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--button-dark); }
    .pick:disabled { opacity: 0.6; cursor: default; }

    .status { margin-top: 18px; font-size: 1.3rem; opacity: 0.9; text-align: center; }

    .history {
      margin-top: 14px;
      max-width: 1000px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .history span {
      background: rgba(255,255,255,0.18);
      border-radius: 10px;
      padding: 4px 12px;
      font-size: 1.3rem;
      font-weight: 600;
    }
    .history span:first-child { background: white; color: var(--text); }

    .reset {
      margin-top: 20px;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 600;
      color: white;
      background: transparent;
      border: 2px solid rgba(255,255,255,0.6);
      border-radius: 999px;
      padding: 6px 22px;
      cursor: pointer;
    }
    .hint { margin-top: 14px; opacity: 0.6; font-size: 1rem; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="/">← Home</a>
    <button class="icon-btn" id="fullscreen">⛶ Fullscreen</button>
  </div>

  <h1>🎲 Number Picker</h1>

  <div class="settings">
    <label>From <input type="number" id="min" value="1" min="1"></label>
    <label>to <input type="number" id="max" value="35" min="1"></label>
    <label><input type="checkbox" id="norepeat" checked> No repeats ・ 重複なし</label>
  </div>

  <div class="stage"><div id="number">?</div></div>

  <button class="pick" id="pick">Pick!</button>
  <div class="status" id="status"></div>
  <div class="history" id="history"></div>
  <button class="reset" id="reset">↺ Start over ・ リセット</button>
  <div class="hint">Tip: press the Space bar to pick</div>

  <script>
    const minEl = document.getElementById("min");
    const maxEl = document.getElementById("max");
    const noRepeatEl = document.getElementById("norepeat");
    const numberEl = document.getElementById("number");
    const pickBtn = document.getElementById("pick");
    const statusEl = document.getElementById("status");
    const historyEl = document.getElementById("history");

    let called = [];
    let rolling = false;
    let audio;

    function beep(freq, length, volume = 0.15) {
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = "square";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + length);
        osc.connect(gain).connect(audio.destination);
        osc.start();
        osc.stop(audio.currentTime + length);
      } catch (e) {}
    }

    function range() {
      let lo = parseInt(minEl.value) || 1;
      let hi = parseInt(maxEl.value) || lo;
      if (hi < lo) [lo, hi] = [hi, lo];
      return [lo, hi];
    }

    function available() {
      const [lo, hi] = range();
      const all = [];
      for (let n = lo; n <= hi; n++) all.push(n);
      return noRepeatEl.checked ? all.filter(n => !called.includes(n)) : all;
    }

    function updateStatus() {
      const [lo, hi] = range();
      const total = hi - lo + 1;
      if (noRepeatEl.checked) {
        const left = available().length;
        statusEl.textContent = `${left} of ${total} left ・ 残り ${left} 人`;
      } else {
        statusEl.textContent = `Picking from ${lo} to ${hi}`;
      }
      historyEl.innerHTML = called.slice().reverse().map(n => `<span>${n}</span>`).join("");
    }

    function pick() {
      if (rolling) return;
      const pool = available();
      if (pool.length === 0) {
        numberEl.className = "small";
        numberEl.textContent = "Everyone has been picked! 🎉";
        return;
      }
      rolling = true;
      pickBtn.disabled = true;
      numberEl.className = "";

      const [lo, hi] = range();
      const result = pool[Math.floor(Math.random() * pool.length)];
      let delay = 40;

      function step() {
        numberEl.textContent = lo + Math.floor(Math.random() * (hi - lo + 1));
        beep(500 + Math.random() * 300, 0.04, 0.06);
        delay *= 1.12;
        if (delay < 320) {
          setTimeout(step, delay);
        } else {
          numberEl.textContent = result;
          numberEl.className = "pop";
          beep(880, 0.15); setTimeout(() => beep(1320, 0.3), 120);
          called.push(result);
          updateStatus();
          rolling = false;
          pickBtn.disabled = false;
        }
      }
      step();
    }

    function reset() {
      called = [];
      numberEl.className = "";
      numberEl.textContent = "?";
      updateStatus();
    }

    pickBtn.addEventListener("click", pick);
    document.getElementById("reset").addEventListener("click", reset);
    [minEl, maxEl].forEach(el => el.addEventListener("change", reset));
    noRepeatEl.addEventListener("change", updateStatus);

    document.addEventListener("keydown", e => {
      if (e.code === "Space" && e.target.tagName !== "INPUT") {
        e.preventDefault();
        pick();
      }
    });

    document.getElementById("fullscreen").addEventListener("click", () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });

    updateStatus();
  </script>
</body>
</html>
