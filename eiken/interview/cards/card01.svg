<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="A girl watering flowers in a school garden, with three birds on the fence">
  <!-- sky and ground -->
  <rect width="400" height="260" fill="#cfe9fb"/>
  <circle cx="352" cy="38" r="20" fill="#ffd34d"/>
  <rect y="150" width="400" height="110" fill="#9fd67a"/>

  <!-- school building in the back -->
  <rect x="20" y="62" width="150" height="70" fill="#f3e3c3" stroke="#c9b48c" stroke-width="2"/>
  <rect x="78" y="44" width="34" height="22" fill="#f3e3c3" stroke="#c9b48c" stroke-width="2"/>
  <circle cx="95" cy="55" r="7" fill="#fff" stroke="#c9b48c" stroke-width="2"/>
  <g fill="#9cc9ea" stroke="#c9b48c" stroke-width="1.5">
    <rect x="32" y="76" width="22" height="16"/><rect x="62" y="76" width="22" height="16"/>
    <rect x="106" y="76" width="22" height="16"/><rect x="136" y="76" width="22" height="16"/>
    <rect x="32" y="102" width="22" height="16"/><rect x="62" y="102" width="22" height="16"/>
    <rect x="106" y="102" width="22" height="16"/><rect x="136" y="102" width="22" height="16"/>
  </g>

  <!-- fence -->
  <g fill="#fff7ea" stroke="#b99c74" stroke-width="2">
    <rect x="0" y="128" width="400" height="7"/>
    <rect x="0" y="146" width="400" height="7"/>
  </g>
  <g fill="#fff7ea" stroke="#b99c74" stroke-width="2">
    <rect x="12" y="120" width="10" height="42"/><rect x="62" y="120" width="10" height="42"/>
    <rect x="112" y="120" width="10" height="42"/><rect x="162" y="120" width="10" height="42"/>
    <rect x="212" y="120" width="10" height="42"/><rect x="262" y="120" width="10" height="42"/>
    <rect x="312" y="120" width="10" height="42"/><rect x="362" y="120" width="10" height="42"/>
  </g>

  <!-- three birds on the top rail -->
  <defs>
  <g id="bird">
    <ellipse cx="0" cy="0" rx="10" ry="7" fill="#6b8fd6"/>
    <circle cx="9" cy="-6" r="5" fill="#6b8fd6"/>
    <circle cx="10.5" cy="-7" r="1.3" fill="#222"/>
    <path d="M14 -6 l5 1.5 -5 1.5z" fill="#f2a33a"/>
    <path d="M-10 -1 l-7 -4 2 6z" fill="#5574b8"/>
    <path d="M-2 7 v4 M3 7 v4" stroke="#f2a33a" stroke-width="1.5"/>
  </g>
  </defs>
  <use href="#bird" transform="translate(88 117)"/>
  <use href="#bird" transform="translate(240 117)"/>
  <use href="#bird" transform="translate(338 117) scale(-1 1)"/>

  <!-- flower bed -->
  <rect x="24" y="196" width="170" height="34" rx="6" fill="#a9744f"/>
  <g stroke="#3f8f3a" stroke-width="3">
    <path d="M44 198 v-22 M74 198 v-26 M104 198 v-20 M134 198 v-26 M164 198 v-22"/>
  </g>
  <g>
    <circle cx="44" cy="174" r="8" fill="#ff7aa8"/><circle cx="44" cy="174" r="3" fill="#ffe066"/>
    <circle cx="74" cy="170" r="8" fill="#ffb347"/><circle cx="74" cy="170" r="3" fill="#ffe066"/>
    <circle cx="104" cy="176" r="8" fill="#c58cff"/><circle cx="104" cy="176" r="3" fill="#ffe066"/>
    <circle cx="134" cy="170" r="8" fill="#ff7aa8"/><circle cx="134" cy="170" r="3" fill="#ffe066"/>
    <circle cx="164" cy="174" r="8" fill="#ffb347"/><circle cx="164" cy="174" r="3" fill="#ffe066"/>
  </g>

  <!-- tomato plants -->
  <rect x="300" y="210" width="88" height="22" rx="6" fill="#a9744f"/>
  <g stroke="#b99c74" stroke-width="3"><path d="M318 212 v-48 M368 212 v-48"/></g>
  <g stroke="#3f8f3a" stroke-width="3" fill="none">
    <path d="M318 212 q-10 -20 0 -44"/><path d="M368 212 q10 -20 0 -44"/>
  </g>
  <g fill="#e2463b">
    <circle cx="312" cy="186" r="6"/><circle cx="324" cy="196" r="6"/><circle cx="322" cy="176" r="5"/>
    <circle cx="362" cy="190" r="6"/><circle cx="374" cy="180" r="5"/><circle cx="370" cy="200" r="6"/>
  </g>

  <!-- water drops -->
  <g fill="#4aa3e8">
    <ellipse cx="190" cy="176" rx="2" ry="3.5"/><ellipse cx="184" cy="186" rx="2" ry="3.5"/>
    <ellipse cx="178" cy="178" rx="2" ry="3.5"/><ellipse cx="172" cy="190" rx="2" ry="3.5"/>
    <ellipse cx="180" cy="196" rx="2" ry="3.5"/>
  </g>

  <!-- girl -->
  <g>
    <!-- legs and shoes -->
    <path d="M246 214 v22 M258 214 v22" stroke="#f6d2b0" stroke-width="6" stroke-linecap="round"/>
    <rect x="240" y="234" width="12" height="6" rx="3" fill="#4b3a6b"/>
    <rect x="254" y="234" width="12" height="6" rx="3" fill="#4b3a6b"/>
    <!-- dress -->
    <path d="M240 172 h26 l8 44 h-42z" fill="#ff8fb1"/>
    <!-- back arm -->
    <path d="M266 180 q10 14 4 24" stroke="#f6d2b0" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- hair (back) and ponytail -->
    <circle cx="253" cy="154" r="17" fill="#5a3a22"/>
    <path d="M268 150 q14 6 8 22" stroke="#5a3a22" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- face -->
    <circle cx="251" cy="157" r="14" fill="#f6d2b0"/>
    <path d="M237 152 q14 -14 28 -2" fill="#5a3a22"/>
    <circle cx="245" cy="158" r="1.8" fill="#2b2540"/>
    <path d="M242 165 q4 3 8 0" stroke="#c0675a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- watering can -->
    <rect x="198" y="168" width="26" height="20" rx="4" fill="#4fb3a3"/>
    <path d="M224 172 q10 0 10 10" stroke="#4fb3a3" stroke-width="3" fill="none"/>
    <path d="M200 172 l-12 -8" stroke="#4fb3a3" stroke-width="4" stroke-linecap="round"/>
    <!-- front arm holding the can -->
    <path d="M244 178 q-10 4 -16 0" stroke="#f6d2b0" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
