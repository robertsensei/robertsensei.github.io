<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eiken Interview Practice | 英検面接練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8ec;
    --ink: #2b2540;
    --muted: #7a7290;
    --card: #ffffff;
    --line: #eadfca;
    --accent: #3d6fd6;
    --accent-dark: #2a52a8;
    --good: #3cb371;
    --good-dark: #2a8a55;
    --warn: #ff8a3d;
    --again: #ef5a5a;
    --again-dark: #c23d3d;
    --shadow: 0 6px 0 rgba(43, 37, 64, .08), 0 14px 30px rgba(43, 37, 64, .08);
    --font: "Fredoka", "M PLUS Rounded 1c", system-ui, sans-serif;
    --font-ja: "M PLUS Rounded 1c", "Fredoka", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font); color: var(--ink); background: var(--bg);
    background-image: radial-gradient(#f3e6cd 1.5px, transparent 1.5px); background-size: 22px 22px;
    min-height: 100vh; -webkit-tap-highlight-color: transparent;
  }
  .ja { font-family: var(--font-ja); }
  button { font-family: inherit; cursor: pointer; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 18px 16px 40px; }
  .hidden { display: none !important; }

  /* Header */
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .home-link {
    width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--card);
    display: grid; place-items: center; text-decoration: none; color: var(--muted); font-size: 22px; font-weight: 700;
  }
  .logo-mark {
    width: 52px; height: 52px; border-radius: 14px; background: var(--accent); color: #fff;
    display: grid; place-items: center; font-size: 26px; box-shadow: 0 5px 0 var(--accent-dark); transform: rotate(-6deg);
  }
  header h1 { margin: 0; font-size: 28px; line-height: 1; }
  header .sub { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .spacer { flex: 1; }
  .sub-toggle {
    border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px;
    font-size: 15px; font-weight: 600; color: var(--muted);
  }
  .sub-toggle.on { color: var(--accent-dark); border-color: var(--accent); }

  .panel { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }

  /* Start screen */
  .intro h2 { margin: 0 0 8px; font-size: 24px; }
  .intro ol { margin: 8px 0 0; padding-left: 22px; line-height: 1.8; font-size: 16px; }
  .cards-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .pick {
    text-align: left; border: 2px solid var(--line); background: #fffdf8; border-radius: 18px; padding: 12px;
    display: flex; gap: 12px; align-items: center; color: var(--ink);
  }
  .pick:hover { border-color: var(--accent); }
  .pick img { width: 96px; height: 62px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  .pick .t { font-size: 19px; font-weight: 600; }
  .pick .g { font-size: 14px; color: var(--muted); }

  /* Interview screen */
  .progress { display: flex; gap: 5px; margin-bottom: 14px; }
  .progress span { flex: 1; height: 8px; border-radius: 99px; background: #eee3cf; }
  .progress span.done { background: var(--accent); }
  .progress span.now { background: var(--warn); }

  .stage { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .stage { grid-template-columns: 1fr; } }

  /* Question card */
  .qcard { position: relative; min-height: 200px; }
  .qcard .ctitle { text-align: center; font-size: 22px; font-weight: 700; margin: 0 0 8px; }
  .qcard .passage { font-size: 20px; line-height: 1.6; margin: 0 0 12px; }
  .qcard img { width: 100%; max-height: 40vh; object-fit: contain; background: #cfe9fb; display: block; border-radius: 14px; border: 2px solid var(--line); }
  .qcard .back {
    display: grid; place-items: center; min-height: 300px; border-radius: 16px; color: var(--muted);
    background: repeating-linear-gradient(45deg, #f6efe1 0 14px, #fbf6ec 14px 28px); font-size: 18px; text-align: center;
  }
  .qcard .none { display: grid; place-items: center; min-height: 300px; color: var(--muted); font-size: 18px; text-align: center; }
  .countdown {
    position: absolute; top: -18px; right: -12px; width: 64px; height: 64px; border-radius: 50%;
    background: var(--warn); color: #fff; font-size: 30px; font-weight: 700; display: grid; place-items: center;
    box-shadow: 0 4px 0 #d9661c;
  }

  /* Examiner */
  .examiner { display: flex; gap: 14px; align-items: flex-start; }
  .face { width: 84px; height: 84px; flex: none; }
  .face .mouth { transition: transform .1s; transform-origin: 42px 58px; }
  .talking .face .mouth { animation: talk .28s infinite alternate; }
  @keyframes talk { from { transform: scaleY(.4); } to { transform: scaleY(1.3); } }
  .bubble {
    position: relative; background: #eef3ff; border-radius: 18px; padding: 14px 16px; font-size: 21px; line-height: 1.45;
    flex: 1; min-height: 60px;
  }
  .bubble .who { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; margin-bottom: 4px; }
  .bubble .listen { color: var(--muted); font-size: 18px; }

  /* Student */
  .student { margin-top: 16px; border-top: 2px dashed var(--line); padding-top: 14px; }
  .student .who { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .tip { font-size: 17px; margin: 6px 0 10px; }
  .example { background: #f2fbf5; border-radius: 14px; padding: 10px 14px; font-size: 19px; margin-bottom: 10px; }
  .timer { height: 12px; border-radius: 99px; background: #eee3cf; overflow: hidden; margin: 6px 0 14px; }
  .timer div { height: 100%; width: 0; background: var(--good); transition: background .3s; }
  .timer div.late { background: var(--warn); }

  .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    border: 0; border-radius: 16px; padding: 14px 20px; font-size: 19px; font-weight: 600; color: #fff;
    background: var(--accent); box-shadow: 0 5px 0 var(--accent-dark);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
  .btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
  .btn.yes { background: var(--good); box-shadow: 0 5px 0 var(--good-dark); }
  .btn.no { background: var(--again); box-shadow: 0 5px 0 var(--again-dark); }
  .btn.big { font-size: 22px; padding: 16px 28px; }
  .btn:disabled { opacity: .45; }

  .finish { text-align: center; padding: 30px 20px; }
  .finish .star { font-size: 64px; }
  .finish h2 { margin: 8px 0; font-size: 30px; }
  .finish p { font-size: 18px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home-link" href="/" title="Home">⌂</a>
    <div class="logo-mark">🎤</div>
    <div>
      <h1>Interview Practice</h1>
      <div class="sub ja">英検 面接練習</div>
    </div>
    <div class="spacer"></div>
    <button class="sub-toggle ja" id="subToggle">字幕 Subtitles: ON</button>
  </header>

  <!-- START -->
  <section id="start">
    <div class="panel intro ja">
      <h2>本番と同じ流れで練習しよう！</h2>
      <ol>
        <li>入室してあいさつ</li>
        <li>カードのパッセージを<b>20秒</b>黙読</li>
        <li>パッセージを音読</li>
        <li>No.1〜3：パッセージと絵についての質問</li>
        <li>カードを裏返して No.4〜5：あなた自身についての質問</li>
        <li>カードを返して退室</li>
      </ol>
      <p>聞き取れなかったら <b>“Pardon?”</b> と言って 🔁 ボタンを押そう。本番でも聞き返してOK！</p>
    </div>
    <div class="panel">
      <div class="cards-list" id="cardsList"></div>
    </div>
  </section>

  <!-- INTERVIEW -->
  <section id="interview" class="hidden">
    <div class="progress" id="progress"></div>
    <div class="stage">
      <div class="panel qcard" id="qcard"></div>
      <div class="panel">
        <div class="examiner" id="examiner">
          <svg class="face" viewBox="0 0 84 84" aria-hidden="true">
            <circle cx="42" cy="42" r="40" fill="#dfe8fb"/>
            <path d="M14 34 q28 -30 56 0 q-6 -26 -28 -26 q-22 0 -28 26z" fill="#4a3b33"/>
            <circle cx="42" cy="46" r="24" fill="#f6d2b0"/>
            <path d="M18 40 q24 -26 48 0 q-2 -16 -24 -18 q-22 2 -24 18z" fill="#4a3b33"/>
            <circle cx="33" cy="45" r="2.6" fill="#2b2540"/><circle cx="51" cy="45" r="2.6" fill="#2b2540"/>
            <ellipse class="mouth" cx="42" cy="58" rx="6" ry="3" fill="#c0675a"/>
          </svg>
          <div class="bubble">
            <div class="who ja">面接委員 Examiner</div>
            <div id="examText"></div>
          </div>
        </div>
        <div class="student">
          <div class="who ja">あなたの番 Your turn</div>
          <div class="tip ja" id="tip"></div>
          <div class="example hidden" id="example"></div>
          <div class="timer" id="timer"><div></div></div>
          <div class="buttons" id="buttons"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- FINISH -->
  <section id="finish" class="hidden">
    <div class="panel finish ja">
      <div class="star">🎉</div>
      <h2>Great job!</h2>
      <p>面接の流れをひと通り練習できました。</p>
      <div class="buttons" style="justify-content:center">
        <button class="btn big" id="again">🔁 もう一度</button>
        <button class="btn big ghost" id="toList">カードを選ぶ</button>
      </div>
    </div>
  </section>
</div>

<script>
// =====================================================================
//  INTERVIEW CARDS — add a card file in cards/ and list it here.
// =====================================================================
const CARDS = [
  { id: "card01", file: "cards/card01.json" },
];

// =====================================================================
//  YOUR OWN VOICE (later)
//  Put an mp3/m4a file in audio/ and write its path next to the line id.
//  Lines without a file use the iPad's built-in voice.
//  For card questions, add  "audio": "audio/card01-q1.mp3"  to the
//  question in the card's .json file.
// =====================================================================
const COMMON_AUDIO = {
  // hello: "audio/common/hello.mp3",
};

const COMMON = {
  hello:  "Hello. Please come in.",
  card:   "Can I have your score card, please?",
  sit:    "Please sit down.",
  name:   "May I have your name, please?",
  howare: "How are you?",
  start:  "OK. Let's start the test. This is your card.",
  silent: "Please read the passage silently.",
  aloud:  "All right. Please read the passage aloud.",
  turn:   "Now, please turn the card over.",
  back:   "This is the end of the test. Could I have the card back, please?",
  bye:    "You may go now.",
};

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pref = {};
try { Object.assign(pref, JSON.parse(localStorage.getItem("rs-interview-v1")) || {}); } catch (e) {}
function savePref() { try { localStorage.setItem("rs-interview-v1", JSON.stringify(pref)); } catch (e) {} }
if (pref.subs === undefined) pref.subs = true;

// ---------- voice ----------
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter((v) => v.lang && v.lang.startsWith("en"));
  const order = ["Samantha", "Google US English", "Alex", "Karen", "Daniel"];
  voice = order.map((n) => vs.find((v) => v.name.includes(n))).find(Boolean)
       || vs.find((v) => v.lang === "en-US") || vs[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

let playToken = 0;
let currentAudio = null;
function stopVoice() {
  playToken++;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  $("examiner").classList.remove("talking");
}
// Plays a line (your recording if there is one, otherwise the built-in voice), then calls done().
function say(text, audioPath, done) {
  stopVoice();
  const token = playToken;
  const finish = () => { if (token !== playToken) return; $("examiner").classList.remove("talking"); done && done(); };
  $("examiner").classList.add("talking");
  const tts = () => {
    if (!("speechSynthesis" in window)) { setTimeout(finish, 1200); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.88; if (voice) u.voice = voice;
    let ended = false;
    const end = () => { if (!ended) { ended = true; finish(); } };
    u.onend = end; u.onerror = end;
    // Safety net: some iPads never fire onend.
    setTimeout(end, 1500 + text.split(" ").length * 520);
    speechSynthesis.speak(u);
  };
  if (audioPath) {
    const a = new Audio(audioPath);
    currentAudio = a;
    a.onended = finish;
    a.play().catch(tts);
  } else tts();
}

// ---------- building the interview ----------
// Each step: what the examiner says, what the card shows, and what the student should do.
function buildSteps(card) {
  const L = (id) => ({ text: COMMON[id], audio: COMMON_AUDIO[id] });
  const Q = (q) => ({ text: q.text, audio: q.audio });
  const qs = card.questions;
  return [
    { line: L("hello"),  show: "none", tip: "あいさつを返して入室しよう。", ex: "Hello.", wait: 5 },
    { line: L("card"),   show: "none", tip: "カードを渡しながら答えよう。", ex: "Here you are.", wait: 5 },
    { line: L("sit"),    show: "none", tip: "お礼を言ってすわろう。", ex: "Thank you.", wait: 5 },
    { line: L("name"),   show: "none", tip: "名前を文で答えよう。", ex: "My name is ____.", wait: 6 },
    { line: L("howare"), show: "none", tip: "元気よく答えよう。", ex: "I'm fine, thank you.", wait: 5 },
    { line: L("start"),  show: "card", tip: "カードを受け取ろう。", ex: "Thank you.", wait: 5 },
    { line: L("silent"), show: "card", tip: "声に出さずにパッセージを読もう。", silent: 20 },
    { line: L("aloud"),  show: "card", tip: "タイトルから、大きな声ではっきり読もう。読み終わったら「次へ」。", wait: 40, readAloud: true },
    { line: Q(qs[0]), show: "card", q: qs[0], wait: 15, label: "No.1" },
    { line: Q(qs[1]), show: "card", q: qs[1], wait: 15, label: "No.2" },
    { line: Q(qs[2]), show: "card", q: qs[2], wait: 15, label: "No.3" },
    { line: L("turn"),   show: "back", tip: "カードを裏返そう。ここからはカードを見ないで答えます。", ex: "", wait: 3 },
    { line: Q(qs[3]), show: "back", q: qs[3], wait: 15, label: "No.4" },
    { line: Q(qs[4]), show: "back", q: qs[4], wait: 10, label: "No.5", yesNo: true },
    { line: L("back"),   show: "none", tip: "カードを返そう。", ex: "Here you are.", wait: 5 },
    { line: L("bye"),    show: "none", tip: "お礼とあいさつをして退室しよう。", ex: "Thank you. Goodbye.", wait: 5 },
  ];
}

let card = null, steps = [], idx = 0, timerRAF = 0, countdownT = 0, shownText = "";

function renderCard(show) {
  const box = $("qcard");
  if (show === "card") {
    box.innerHTML = `<h2 class="ctitle">${esc(card.title)}</h2>
      <p class="passage">${esc(card.passage)}</p>
      <img src="${esc(card.picture)}" alt="${esc(card.pictureAlt || "")}">`;
  } else if (show === "back") {
    box.innerHTML = `<div class="back ja">🔄<br>カードは裏返しています<br>Card turned over</div>`;
  } else {
    box.innerHTML = `<div class="none ja">🚪<br>面接室</div>`;
  }
}

function setExaminer(text) {
  shownText = text;
  $("examText").innerHTML = pref.subs
    ? esc(text)
    : `<span class="listen ja">🔊 よく聞こう… Listen carefully</span>`;
}

function renderProgress() {
  $("progress").innerHTML = steps.map((_, i) =>
    `<span class="${i < idx ? "done" : i === idx ? "now" : ""}"></span>`).join("");
}

function stopTimers() {
  cancelAnimationFrame(timerRAF);
  clearInterval(countdownT);
  const c = document.querySelector(".countdown"); if (c) c.remove();
}

function runAnswerTimer(seconds) {
  const bar = $("timer").firstElementChild;
  const t0 = performance.now();
  const tick = (now) => {
    const p = Math.min(1, (now - t0) / (seconds * 1000));
    bar.style.width = `${p * 100}%`;
    bar.classList.toggle("late", p > 0.7);
    if (p < 1) timerRAF = requestAnimationFrame(tick);
  };
  timerRAF = requestAnimationFrame(tick);
}

function resetTimerBar() {
  const bar = $("timer").firstElementChild;
  bar.style.width = "0"; bar.classList.remove("late");
}

function showStep(followUp) {
  stopTimers();
  const s = steps[idx];
  renderProgress();
  renderCard(s.show);
  resetTimerBar();

  // What the examiner says (a follow-up replaces the main question after Yes/No).
  const line = followUp ? { text: followUp.text, audio: followUp.audio } : s.line;
  const tip = followUp ? followUp.tip : s.q ? s.q.tip : s.tip;
  const ex = followUp ? followUp.model : s.q ? s.q.model : s.ex;
  setExaminer((s.label && !followUp ? s.label + "  " : "") + line.text);
  $("tip").textContent = tip || "";
  $("example").classList.add("hidden");
  $("example").textContent = ex ? "例) " + ex : "";

  // Buttons
  const btns = [];
  btns.push(`<button class="btn ghost" id="repeat">🔁 Pardon?</button>`);
  if (ex) btns.push(`<button class="btn ghost ja" id="showEx">💡 例を見る</button>`);
  if (s.yesNo && !followUp) {
    btns.push(`<button class="btn yes" id="saidYes">Yes と答えた</button>`);
    btns.push(`<button class="btn no" id="saidNo">No と答えた</button>`);
  } else if (!s.silent) {
    btns.push(`<button class="btn" id="next">次へ ▶</button>`);
  }
  $("buttons").innerHTML = btns.join("");

  const play = () => {
    resetTimerBar(); cancelAnimationFrame(timerRAF);
    say(line.text, line.audio, () => {
      if (s.silent && !followUp) startSilentReading(s.silent);
      else runAnswerTimer(s.wait || 10);
    });
  };
  $("repeat").onclick = play;
  if ($("showEx")) $("showEx").onclick = () => $("example").classList.toggle("hidden");
  if ($("next")) $("next").onclick = next;
  if ($("saidYes")) $("saidYes").onclick = () => showStep(s.q.followYes);
  if ($("saidNo")) $("saidNo").onclick = () => showStep(s.q.followNo);
  play();
}

function startSilentReading(seconds) {
  $("repeat").disabled = true;
  let left = seconds;
  const c = document.createElement("div");
  c.className = "countdown"; c.textContent = left;
  $("qcard").appendChild(c);
  runAnswerTimer(seconds);
  countdownT = setInterval(() => {
    left--;
    c.textContent = left;
    if (left <= 0) { clearInterval(countdownT); next(); }
  }, 1000);
}

function next() {
  stopVoice(); stopTimers();
  idx++;
  if (idx >= steps.length) { showScreen("finish"); return; }
  showStep();
}

function showScreen(name) {
  ["start", "interview", "finish"].forEach((s) => $(s).classList.toggle("hidden", s !== name));
  window.scrollTo(0, 0);
}

async function startCard(id) {
  const info = CARDS.find((c) => c.id === id);
  card = await (await fetch(info.file)).json();
  steps = buildSteps(card);
  idx = 0;
  showScreen("interview");
  showStep();
}

// ---------- start screen ----------
async function renderList() {
  const list = $("cardsList");
  const cards = await Promise.all(CARDS.map(async (c) => {
    try { return { ...(await (await fetch(c.file)).json()), id: c.id }; } catch (e) { return null; }
  }));
  list.innerHTML = cards.filter(Boolean).map((c) => `
    <button class="pick" data-id="${esc(c.id)}">
      <img src="${esc(c.picture)}" alt="">
      <div><div class="t">${esc(c.title)}</div><div class="g ja">英検${esc(c.grade)} ・ スタート ▶</div></div>
    </button>`).join("");
  list.querySelectorAll(".pick").forEach((b) => b.onclick = () => startCard(b.dataset.id));
}

function renderSubToggle() {
  $("subToggle").textContent = `字幕 Subtitles: ${pref.subs ? "ON" : "OFF"}`;
  $("subToggle").classList.toggle("on", pref.subs);
}
$("subToggle").onclick = () => {
  pref.subs = !pref.subs; savePref(); renderSubToggle();
  if (!$("interview").classList.contains("hidden")) {
    setExaminer(shownText);
  }
};
$("again").onclick = () => startCard(card.id);
$("toList").onclick = () => showScreen("start");

renderSubToggle();
renderList();
</script>
</body>
</html>
